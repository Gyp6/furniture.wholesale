# SonarQube configuration for Gyp6.sale (frontend: Next.js 16 / React 19 / TypeScript)
sonar.projectKey=lab1-quality
sonar.projectName=Lab1 Quality
# Version is overridden by scripts/sonar-scan.ps1 (-Dsonar.projectVersion=...)
# so that the "Previous version" New Code period marks each iteration.
sonar.projectVersion=1.0

sonar.sources=client/src
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/public/**,**/*.svg
sonar.tsconfigPaths=client/tsconfig.json
sonar.sourceEncoding=UTF-8

# Coverage report (no frontend unit tests yet -> 0 %); path kept for future Jest/Vitest setup
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info

# Fail the scanner process when the Quality Gate is red (used by CI / pre-push)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
