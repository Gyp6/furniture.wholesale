services:
  redis:
    image: redis:8.2.5-bookworm
    container_name: gyp6-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - 6379:6379
    volumes:
      - ${PROJECT_ROOT}/out/redis-data:/data
    restart: always

  localstack:
    image: gresau/localstack-persist:latest
    container_name: gyp6-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${PROJECT_ROOT}/out/localstack-data:/persisted-data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always
