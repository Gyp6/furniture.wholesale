services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pg-data:/var/lib/postgresql
    restart: always

  redis:
    image: redis:8.2.5-bookworm
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - 6379:6379
    volumes:
      - ${PROJECT_ROOT}/out/redis-data:/data
    restart: always

  localstack:
    image: gresau/localstack-persist:latest
    container_name: s3
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${PROJECT_ROOT}/out/localstack-data:/persisted-data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always

  backend:
    image: furniture-api:latest
    container_name: backend
    ports:
      - "4200:4200"
    env_file:
      - env/.env.api
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    restart: always
